<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frota">
<title>Frota Disponível</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #18202b; --muted: #637083;
    --line: #e2e7ee; --primary: #1f6feb; --primary-text: #fff;
    --ok: #1a7f37; --ok-bg: #e6f6ea; --warn: #9a6700; --warn-bg: #fff6d6;
    --bad: #c62828; --bad-bg: #fdecec; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a; --card: #18202a; --text: #e8edf3; --muted: #93a1b3;
      --line: #2a3542; --primary: #4c8dff; --ok: #4fc26a; --ok-bg: #16301d;
      --warn: #e3b341; --warn-bg: #33290f; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--primary); }
  header {
    position: sticky; top: 0; z-index: 500; background: var(--primary); color: var(--primary-text);
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hBtns { display: flex; gap: 6px; }
  #hBtns button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card.pad0 { padding: 0; overflow: hidden; }
  .card.destaque { border: 2px solid var(--ok); }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600;
    background: var(--primary); color: var(--primary-text); cursor: pointer; text-align: center; text-decoration: none; font-family: inherit;
  }
  .btn.sec { background: transparent; color: var(--primary); border: 1px solid var(--line); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.bad { background: var(--bad); color: #fff; }
  .btn.warn { background: var(--warn); color: #fff; }
  .btn.big { padding: 22px 14px; font-size: 19px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn + .btn, .btn + p, .card > .btn:not(:first-child) { margin-top: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .acoes { margin-bottom: 14px; }
  .acoes .btn + .btn { margin-top: 0; }
  input, select {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); margin-bottom: 10px; font-family: inherit;
  }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .item:first-child { border-top: 0; }
  .item .info { flex: 1; min-width: 180px; }
  .item .title { font-weight: 600; overflow-wrap: anywhere; }
  .item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .item.click { cursor: pointer; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; vertical-align: middle; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.off { background: var(--line); color: var(--muted); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.uso { background: #e3edff; color: #1f4fb5; }
  @media (prefers-color-scheme: dark) { .pill.uso { background: #1b2b4a; color: #8fb4ff; } }
  .mini { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 9px; padding: 8px 10px; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; font-family: inherit; }
  .mini.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .mini.del { color: var(--bad); }
  .alert { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .alert b { display: block; margin-bottom: 4px; }
  .status { text-align: center; padding: 8px 0 14px; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .gps { font-size: 14px; margin: 8px 0 12px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .tabs button { flex: 1 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .tabs button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .tabs .cont { font-size: 12px; background: var(--bg); color: var(--muted); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
  .tabs button.on .cont { background: rgba(255,255,255,.25); color: #fff; }

  /* Painel do administrador: tela larga no computador, com menu na lateral */
  main.largo { max-width: 1240px; }
  @media (min-width: 600px) and (max-width: 999px) { .painel > .tabs { flex-wrap: wrap; overflow: visible; } }
  @media (min-width: 1000px) {
    main.largo { padding: 22px 24px 40px; }
    .painel { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
    .painel > .tabs { flex-direction: column; overflow: visible; position: sticky; top: 84px; margin: 0; gap: 4px; }
    .painel > .tabs button { flex: none; display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 12px 14px; border-color: transparent; background: transparent; }
    .painel > .tabs button:hover:not(.on) { background: var(--card); border-color: var(--line); }
    .painel > .tabs button.on { background: var(--primary); }
  }

  /* Aba Início */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--cor, var(--primary)); border-radius: var(--radius); padding: 14px 16px; text-align: left; cursor: pointer; font-family: inherit; color: var(--text); transition: transform .12s, box-shadow .12s; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .kpi .n { font-size: 32px; font-weight: 800; line-height: 1.1; color: var(--cor, var(--text)); }
  .kpi .t { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  @media (max-width: 599px) {
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 12px; }
    .kpi .n { font-size: 26px; }
    .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }
  .duas { display: grid; gap: 0 14px; }
  @media (min-width: 900px) { .duas { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; } }
  .barra { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
  .barra i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .passos li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .passos li:first-child { border-top: 0; }
  .passos .tx { flex: 1; font-weight: 600; }
  .passos .ck { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--primary); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .passos .feito { cursor: default; }
  .passos .feito .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
  .passos .feito .tx { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .numeros div { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
  .numeros b { display: block; font-size: 24px; line-height: 1.2; }
  .numeros span { font-size: 12px; color: var(--muted); }
  .grafico svg { width: 100%; height: auto; max-height: 170px; display: block; }
  .grafico rect { fill: var(--primary); }
  .grafico text { fill: var(--muted); font-size: 7px; }
  .tops { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .rank { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 14px; }
  .rank span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eventos li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .eventos li:first-child { border-top: 0; }
  .eventos li .muted { white-space: nowrap; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #18202b; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100% - 32px); z-index: 2000; text-align: center; }
  .toast.show { opacity: 1; }
  .ocupado { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1900; display: flex; align-items: center; justify-content: center; }
  .ocupado div { background: var(--card); color: var(--text); padding: 18px 22px; border-radius: 14px; font-weight: 600; max-width: 80%; text-align: center; }

  /* Janela (modal) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1500; display: flex; align-items: flex-end; justify-content: center; }
  .modal .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { .modal { align-items: center; } .modal .sheet { border-radius: 18px; } }
  .camera { position: relative; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; aspect-ratio: 3 / 4; max-height: 55vh; width: 100%; }
  .camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera .mira { position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 16px; }
  .camera.moldura { aspect-ratio: 4 / 3; }
  .camera .contorno { position: absolute; left: 5%; top: 5%; width: 90%; height: 90%; fill: none; stroke: rgba(255,255,255,.92); stroke-width: 3; stroke-dasharray: 10 7; pointer-events: none; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  .camera .contorno text { fill: rgba(255,255,255,.92); stroke: none; font: 600 15px system-ui, sans-serif; }
  .camera .rec { position: absolute; top: 10px; left: 10px; background: var(--bad); color: #fff; padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 14px; }

  /* Vistoria */
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .slot { border: 2px dashed var(--line); background: var(--bg); color: var(--text); border-radius: 12px; aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px; font-size: 13px; font-weight: 600; position: relative; overflow: hidden; font-family: inherit; }
  .slot .ph { font-size: 26px; }
  .slot.sel { border-style: solid; border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 2px var(--primary) inset; }
  .olho { position: absolute; right: 4px; top: calc(50% - 5px); transform: translateY(-50%); border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 8px; cursor: pointer; width: auto; margin: 0; }
  .slot.ok { border-style: solid; border-color: var(--ok); padding: 0; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot.ok span:last-child { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff; padding: 4px; }
  video.preview { width: 100%; border-radius: 12px; background: #000; margin-bottom: 10px; max-height: 50vh; }

  /* Mapa */
  #mapa { height: 62vh; min-height: 320px; }
  .pin { background: none; border: 0; }
  .pin-in { font-size: 26px; text-align: center; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .pin-nome { background: #1f6feb; color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 5px; white-space: nowrap; transform: translateX(-25%); display: inline-block; }

  /* Etiquetas de QR Code */
  .etiquetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .etiqueta { background: #fff; color: #000; border: 2px solid #000; border-radius: 12px; padding: 14px; text-align: center; break-inside: avoid; }
  .etiqueta img { width: 100%; max-width: 200px; image-rendering: pixelated; }
  .et-nome { font-weight: 800; font-size: 18px; }
  .et-placa { font-size: 16px; letter-spacing: 1px; }
  .et-cod { font: 700 22px monospace; letter-spacing: 4px; }
  .et-inst { font-size: 11px; }

  /* Relatório */
  .relatorio { background: #fff; color: #111; padding: 18px; border-radius: var(--radius); }
  .relatorio h1 { font-size: 22px; margin: 0 0 12px; }
  .relatorio h2 { margin-top: 20px; border-bottom: 2px solid #111; padding-bottom: 4px; }
  .relatorio a { color: #1f4fb5; }
  .relatorio .muted { color: #555; }
  .tab { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tab th, .tab td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
  .tab th { background: #f1f3f6; width: 34%; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .grade figure { margin: 0; break-inside: avoid; }
  .grade img { width: 100%; border-radius: 6px; border: 1px solid #ccc; display: block; }
  .grade figcaption { font-size: 12px; text-align: center; margin-top: 2px; }
  .mapa-rel { height: 320px; border: 1px solid #ccc; border-radius: 6px; }
  .video-bloco video { width: 100%; max-height: 360px; background: #000; border-radius: 6px; margin: 10px 0; }
  .video-qr { display: flex; gap: 12px; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 8px; break-inside: avoid; }
  .video-qr img { width: 110px; height: 110px; image-rendering: pixelated; }
  .rodape { margin-top: 16px; }
  .rel-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 3px solid #1f6feb; padding-bottom: 10px; margin-bottom: 14px; }
  .rel-cab h1 { margin: 2px 0 0 !important; }
  .rel-marca { font-size: 12px; font-weight: 700; color: #1f6feb; letter-spacing: .08em; text-transform: uppercase; }
  .rel-sub { font-size: 15px; color: #333; margin-top: 2px; }
  .rel-id { text-align: right; font-size: 12px; color: #555; white-space: nowrap; }
  .folha { width: 100%; border-collapse: collapse; }
  .folha > thead > tr > td, .folha > tfoot > tr > td, .folha > tbody > tr > td { padding: 0; border: 0; }
  .folha-topo, .folha-pe { display: none; }
  /* Relatório impresso sem o endereço do site, data e título que o navegador coloca nas bordas */
  @page rel { size: A4; margin: 0; }

  @media print {
    .relatorio { page: rel; padding: 0 14mm !important; }
    .folha-topo { display: block; height: 12mm; }
    .folha-pe { display: flex; justify-content: space-between; gap: 12px; margin-top: 6mm; padding: 3mm 0 8mm; border-top: 1px solid #ccc; font-size: 10px; color: #777; }
    header, .no-print, .toast, .tabs { display: none !important; }
    .painel { display: block !important; }
    body { background: #fff; }
    main { max-width: none; padding: 0; }
    .card { border: 0; padding: 0; }
    .relatorio { padding: 0; }
    .relatorio h2 { break-after: avoid; }
    .etiquetas { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1 id="hTitle">🚗 Frota Disponível</h1>
  <div id="hBtns"></div>
</header>
<main id="app"><div class="empty">Carregando…</div></main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module" src="app.js"></script>
<script>
  // Se o app não iniciar (ex.: primeira abertura sem internet), mostra um aviso
  setTimeout(function () {
    if (!window.__frotaOk) document.getElementById("app").innerHTML =
      '<div class="card center"><h2>Não foi possível abrir o app</h2><p class="muted">Na primeira vez é preciso estar com internet. Conecte-se e recarregue a página.</p><button class="btn" onclick="location.reload()">Recarregar</button></div>';
  }, 12000);
</script>
</body>
</html>
